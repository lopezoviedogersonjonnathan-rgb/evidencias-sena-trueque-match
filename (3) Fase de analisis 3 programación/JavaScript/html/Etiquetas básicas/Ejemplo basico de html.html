<!DOCTYPE html> <!-- Indica que este documento usa HTML5 -->

<html lang="es"> <!-- Comienza el documento HTML y define el idioma como español -->

<head><!--Abre la sección de información invisible.
Aquí va información que NO se ve en la pantalla, pero es importante.-->
  <meta charset="UTF-8"> <!-- Define la codificación de caracteres (UTF-8 es estándar para español y otros idiomas) -->
  <title>Mi primera página</title> <!-- Título que aparece en la pestaña del navegador -->
</head>

<body> <!-- Cuerpo del documento: todo lo visible en la página -->

  <header> <!-- Encabezado principal del sitio -->
    <h1>¡Bienvenido a mi sitio!</h1> <!-- Título principal de la página -->
  </header>

  <nav> <!-- Comandante de navegación -->
  <ul> <!-- Mapa táctico: lista sin orden -->
    <li><a href="#inicio">Inicio</a></li> <!-- Punto de control: lleva a la sección "inicio" -->
    <li><a href="#acerca">Acerca de</a></li> <!-- Otro punto: lleva a "acerca" -->
    <li><a href="#contacto">Contacto</a></li> <!-- Último punto: lleva a "contacto" -->
  </ul>
</nav>

  <section id="inicio"> <!-- Sección de contenido con ID "inicio" -->
    <p>Esta es una página creada con HTML5.</p> <!-- Párrafo de texto -->
  </section>

  <section id="acerca"> <!-- Otra sección con ID "acerca" -->
    <h2>Sobre mí</h2> <!-- Subtítulo -->
    <p>Me apasiona la educación, la tecnología y el legado de mi tierra: Pasto, Nariño.</p>
  </section>

  <section id="contacto"> <!-- Sección de contacto -->
    <h2>Contáctame</h2>
    <p>Puedes escribirme a: gerson@example.com</p>
  </section>

  <footer> <!-- Pie de página -->
    <p>© 2025 Gerson Honnathan</p> <!-- Derechos de autor o información final -->
  </footer>

</body>
</html>
