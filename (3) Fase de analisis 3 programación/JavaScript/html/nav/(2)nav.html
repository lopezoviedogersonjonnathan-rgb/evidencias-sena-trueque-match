<!DOCTYPE html> <!-- Indica que usamos HTML5 -->
<html lang="es"> <!-- Idioma español -->
<head>
  <meta charset="UTF-8"> <!-- Acepta caracteres especiales -->
  <title>Navegación Interna</title> <!-- Título que se muestra en la pestaña del navegador -->
</head>

<body> <!-- Aquí empieza el contenido visible -->

  <!-- 🔹 MENÚ DE NAVEGACIÓN -->
  <nav> <!-- Contenedor de navegación -->
    <a href="#inicio">Inicio</a> <!-- href="#inicio" significa "ve a la sección con id='inicio'" -->
    <a href="#acerca">Acerca de</a> <!-- Lleva a la sección "acerca" */
    <a href="#servicios">Servicios</a> <!-- Lleva a la sección "servicios" -->
    <a href="#contacto">Contacto</a> <!-- Lleva a la sección "contacto" -->
  </nav>
  <!-- 🔽 SECCIÓN DE INICIO -->
  <section id="inicio"> <!-- id="inicio" conecta con href="#inicio" -->
    <h1>Bienvenido a mi página</h1>
    <p>Esta es la sección de inicio.</p>
  </section>

  <!-- 🔽 SECCIÓN ACERCA -->
  <section id="acerca">
    <h2>Acerca de mí</h2>
    <p>Aquí hablo sobre quién soy.</p>
  </section>

  <!-- 🔽 SECCIÓN SERVICIOS -->
  <section id="servicios">
    <h2>Mis Servicios</h2>
    <p>Aquí muestro lo que ofrezco.</p>
  </section>

  <!-- 🔽 SECCIÓN CONTACTO -->
  <section id="contacto">
    <h2>Contáctame</h2>
    <p>Aquí puedes enviarme un mensaje.</p>
  </section>

</body>
</html> <!-- Aquí termina el documento HTML -->
