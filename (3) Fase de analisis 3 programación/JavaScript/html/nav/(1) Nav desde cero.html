<!DOCTYPE html> <!-- Le dice al navegador que estamos usando HTML5 -->

<html lang="es"> <!-- Indica que el contenido de la página está en idioma español -->

<head> <!-- Contenedor de información importante que NO se muestra directamente en la página -->
  <meta charset="UTF-8"> <!-- Permite usar caracteres especiales como tildes y la letra ñ correctamente -->
  <title>Mi primera navegación</title> <!-- Título que aparece en la pestaña del navegador -->
</head>

<body> <!-- Aquí empieza todo lo que sí se muestra en la página -->

  <nav> <!-- NAV: Sección de navegación. Aquí van los enlaces principales del sitio -->
    
    <a href="#">Inicio</a> 
    <!-- <a> es un ENLACE
         href="#" significa "a dónde me lleva este enlace"
         El símbolo # indica que todavía no le hemos puesto una dirección real
         "Inicio" es el texto que la persona ve y puede hacer clic -->

    <a href="#">Acerca de</a>
    <!-- Este enlace llevaría a una sección donde hablas sobre ti o tu página -->

    <a href="#">Servicios</a>
    <!-- Este enlace llevaría a una sección donde muestras lo que ofreces -->

    <a href="#">Contacto</a>
    <!-- Este enlace llevaría a una sección donde las personas te pueden enviar mensajes -->

  </nav> <!-- Aquí termina la sección de navegación -->

</body>
</html> <!-- Aquí termina todo el documento HTML -->
