<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Suma</title>
</head>
<body>
  <header>
    <h1>Calculadora de Suma en JavaScript</h1>
    <p>Escribe tus números y haz clic en "Sumar"</p>
  </header>

  <!-- Entradas para los números -->
  <section>
    <label for="num1">Número 1:</label>
    <input type="number" id="num1"><br><br>

    <label for="num2">Número 2:</label>
    <input type="number" id="num2"><br><br>

    <label for="num3">Número 3:</label>
    <input type="number" id="num3"><br><br>

    <button onclick="sumar()">Sumar</button>
  </section>

  <!-- Resultado -->
  <section>
    <h2>Resultado:</h2>
    <p id="resultado">Aquí aparecerá la suma</p>
  </section>

  <script>
    function sumar() {
      // Obtener los valores desde los inputs
      let valor1 = parseFloat(document.getElementById("num1").value) || 0;
      let valor2 = parseFloat(document.getElementById("num2").value) || 0;
      let valor3 = parseFloat(document.getElementById("num3").value) || 0;

      // Realizar la suma
      let suma = valor1 + valor2 + valor3;

      // Mostrar el resultado en la página
      document.getElementById("resultado").innerText = "La suma total es: " + suma;
    }
  </script>
</body>
</html>
