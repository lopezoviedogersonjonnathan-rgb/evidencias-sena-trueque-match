<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuadrado</title>
</head>
<body>
  
  <h1>Calculadora de Cuadrado</h1>
  <p>Abre la consola del navegador (F12) para ver los resultados</p>

  <script>
    // Función para calcular cuadrado
    function calcularCuadrado() {
      
      // Pedir dato al usuario (solo necesitamos un lado)
      let a = parseFloat(prompt("Lado a del cuadrado:"));

      // Validar que sea número
      if (isNaN(a)) {
        console.log("Error: Dato inválido");
        return;
      }

      // Validar que sea positivo
      if (a <= 0) {
        console.log("Error: El valor debe ser mayor que 0");
        return;
      }

      // Calcular perímetro: 4 x a
      let perimetro = 4 * a;

      // Calcular área: a²
      let area = a * a;

      // Mostrar en consola
      console.log("=== CUADRADO ===");
      console.log("Perímetro: " + perimetro);
      console.log("Área: " + area);
    }

    // Ejecutar
    calcularCuadrado();
  </script>

</body>
</html>
